name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel in-progress runs when a new commit lands on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build web
        run: npm run build:web

      - name: Verify MCP bundle is up to date
        run: |
          npm run build:mcp
          if ! git diff --exit-code apps/mcp/server.bundle.js; then
            echo "::error file=apps/mcp/server.bundle.js::server.bundle.js is stale. Run 'npm run build:mcp' locally and commit the result."
            exit 1
          fi
