name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel in-progress runs when a new commit lands on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pagent_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pagent_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pagent_e2e?sslmode=verify-full
      PAGENT_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Verify production deploy layout
        run: npm run check:deploy

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Configure trusted PostgreSQL TLS for production-mode tests
        env:
          PAGENT_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          PGPASSWORD: postgres
          PGSSLMODE: disable
        run: |
          pagent_tls_dir=$(mktemp -d)
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$pagent_tls_dir/server.key" -out "$pagent_tls_dir/server.crt" \
            -days 1 -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
          docker cp "$pagent_tls_dir/server.key" "$PAGENT_POSTGRES_CONTAINER:/tmp/pagent-test.key"
          docker cp "$pagent_tls_dir/server.crt" "$PAGENT_POSTGRES_CONTAINER:/tmp/pagent-test.crt"
          docker exec --user root "$PAGENT_POSTGRES_CONTAINER" chown postgres:postgres /tmp/pagent-test.key /tmp/pagent-test.crt
          docker exec --user root "$PAGENT_POSTGRES_CONTAINER" chmod 600 /tmp/pagent-test.key
          psql --host=127.0.0.1 --port=5432 --username=postgres --dbname=postgres \
            -c "ALTER SYSTEM SET ssl_cert_file = '/tmp/pagent-test.crt'" \
            -c "ALTER SYSTEM SET ssl_key_file = '/tmp/pagent-test.key'" \
            -c "ALTER SYSTEM SET ssl = 'on'" -c 'SELECT pg_reload_conf()'
          echo "NODE_EXTRA_CA_CERTS=$pagent_tls_dir/server.crt" >> "$GITHUB_ENV"
          echo "PGSSLROOTCERT=$pagent_tls_dir/server.crt" >> "$GITHUB_ENV"

      - name: Verify production test database TLS
        run: |
          test "$(psql "$DATABASE_URL" -XAtc 'select ssl from pg_stat_ssl where pid = pg_backend_pid()')" = t

      - name: Prepare deck integration databases
        env:
          PGPASSWORD: postgres
        run: |
          for database in \
            pagent_deck_routes_owner_d3a0_test \
            pagent_deck_schema_d3a0_test \
            pagent_deck_routes_permissions_d3a0_test \
            pagent_deck_engagement_d3a0_test \
            pagent_deck_engagement_concurrent_d3a0_test \
            pagent_engagement_readiness_20260922_test \
            pagent_deck_permissions_d3a0_test \
            pagent_deck_sharing_d3a0_test \
            pagent_deck_routes_sharing_d3a0_test \
            pagent_deck_repository_d3a0_test \
            pagent_launch_acceptance_d3a0_test \
            pagent_workspace_admin_d3a0_test
          do
            createdb --host=127.0.0.1 --port=5432 --username=postgres "$database"
          done

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit and integration tests with coverage
        run: npm run test:coverage

      - name: Build and verify the shipped MCP bundle
        run: |
          npm run build:mcp
          if ! git diff --exit-code apps/mcp/server.bundle.js; then
            echo "::error file=apps/mcp/server.bundle.js::server.bundle.js is stale. Run 'npm run build:mcp' locally and commit the result."
            exit 1
          fi

      - name: Production end-to-end tests
        run: npm run test:e2e

      - name: Build web
        # VITE_API_URL is required by `vite build` (see apps/web/vite.config.ts).
        # CI uses a placeholder; production deploys set the real value in Vercel.
        env:
          VITE_API_URL: https://api.pagent.link
        run: npm run build:web
