        content: { application/json: { schema: { $ref: '#/components/schemas/EngagementBatch' } } }
      responses:
        {
          '202': { description: Events accepted idempotently. },
          '410': { description: Session is unavailable or does not own the visit. },
          '429': { description: Per-client-IP engagement delivery limit exceeded. },
        }

  /{id}:
    parameters:
      - $ref: '#/components/parameters/PageId'
    get:
      operationId: getPage
      tags: [Pages]
      summary: Get page spec and current state
      description: |
        Returns the full page record including the original `spec`, the
        current `state`, the `result` (null until submitted), and when the
        page expires.

        **What to do next:**
        - If `state` is `open`, the user has not yet submitted. Show them the
          URL or wait.
        - If `state` is `submitted`, the result is ready — read it via
          `GET /{id}/result`.
        - If `state` is `received`, you have already consumed the result.
        - If `expires_at` is in the past, the page has been deleted and you
          will get 404.
      responses:
        '200':
          description: Page found.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponse'
        '404':
          description: |
            No active page with this ID exists. It may have expired (default
            TTL 30 minutes) or never been created. Create a new page if you
            need another.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '500':
          description: Unexpected server error. See 500 on `POST /new` for guidance.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'

  /{id}/result:
    parameters:
      - $ref: '#/components/parameters/PageId'
    post:
      operationId: submitResult
      tags: [Pages]
      summary: Submit a user action for a page (browser → service)
      description: |
        Called by the renderer (browser) when the user submits a form. The
        body is an A2UI action object that the agent reads back via
        `GET /{id}/result`.

        Requires the page to be in state `open`. Calling this twice on the
        same page returns 409.

        **Note:** this endpoint is typically called by the Pagent renderer,
        not directly by the agent. Agents should use `GET /{id}/result`
        to read back the submitted action.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResultRequest'
            example:
              name: submitted
              surfaceId: main
              sourceComponentId: submit-btn
              context:
                color: blue
              timestamp: '2024-01-15T12:34:56.789Z'
      responses:
        '200':
          description: Result recorded. The page is now in state `submitted`.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitOk'
        '400':
          description: |
            Request body is malformed or missing required fields (`name`,
            `surfaceId`); error `bad_request`. Or the target page is HTML
            (view-only and cannot accept a result); error `invalid_for_format`.
            Fix the request — or, for `invalid_for_format`, stop trying to
            submit to this page — before retrying.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '404':
          description: |
            No active page with this ID. The page may have expired. Create
            a new page.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '409':
          description: |
            The page was already submitted. Each page is single-shot — only
            one result can be recorded per page. Create a new page if you
            need another submission.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '500':
          description: Unexpected server error. See 500 on `POST /new` for guidance.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
    get:
      operationId: getResult
      tags: [Pages]
      summary: Poll for a submitted result (agent → service)
      description: |
        Returns the current `state` and `result` for the page. Agents use
        this to poll until the user has submitted the form.

        **State transitions on read:**
        - If `state` is `open`, the user has not yet submitted. Poll again
          after a short back-off (e.g. 1 s, doubling to 30 s max).
        - The **first** call after submission returns `state: "submitted"` and
          the full result, then atomically flips the page to `received`. Use
          the returned result immediately — this is your one chance to observe
          the `submitted` state.
        - Subsequent calls return `state: "received"` with the same result.

        **What to do next:** parse the `result` object and continue the agent
        conversation. `result` is null until the user submits.

        In rollout grace mode (`REQUIRE_AUTH=false`), anonymous polling is
        allowed. A valid Bearer token is still required to include `page:read`;
        otherwise this route returns 403.
      security:
        - BearerAuth: []
        - CookieAuth: []
        - {}
      responses:
        '200':
          description: State and result returned.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'
        '404':
          description: |
            No active page with this ID. The page may have expired. Create
            a new page.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '401':
          description: Authentication is required when `REQUIRE_AUTH=true`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '403':
          description: |
            A valid Bearer token is missing the `page:read` scope. Scope checks
            apply even in rollout grace mode, when an anonymous request would
            be allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '500':
          description: Unexpected server error. See 500 on `POST /new` for guidance.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        OAuth access token. Bearer-authenticated calls to `POST /new` require
        `page:create`, and Bearer-authenticated calls to `GET /{id}/result`
        require `page:read`. These scope checks also apply when
        `REQUIRE_AUTH=false`; that mode permits anonymous calls, not
        under-scoped Bearer calls.
    CookieAuth:
      type: apiKey
      in: cookie
      name: pagent_session
      description: HttpOnly browser session cookie issued after interactive login.

  parameters:
    DocumentAccept:
      name: Accept
      in: header
      description: Including text/html selects a sandboxed HTML error for allowlisted Origins; other clients retain JSON errors.
      schema: { type: string, example: text/html }
    RendererOrigin:
      name: Origin
      in: header
      required: true
      description: Exact allowlisted renderer origin; never derived from a form field.
      schema: { type: string, format: uri, example: 'https://pagent.link' }
    PageId:
      name: id
      in: path
      required: true
      description: 32-character lowercase hex page identifier.
      schema:
        $ref: '#/components/schemas/PageId'
    DeckId:
      name: deckId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ShareLinkId:
      name: linkId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ShareToken:
      name: X-Share-Token
      in: header
      required: true
      description: Opaque token returned only when the share link is created.
      schema: { type: string, minLength: 20 }
    ViewerSession:
      name: X-Viewer-Session
      in: header
      required: true
      description: Opaque viewer or owner-preview session token with a maximum seven-day lifetime.
      schema: { type: string, minLength: 20 }

  responses:
    DocumentFrameError:
      description: |
        The HTTP error status is preserved. With an allowlisted Origin and
        Accept containing text/html, returns generic sandboxed HTML with
        no-referrer/CSP headers and a pagent:error message to the parent.
        Otherwise the existing JSON error body is unchanged. An HTML error
        never includes deck content or credentials.
      headers:
        Cache-Control:
          schema: { type: string, const: 'private, no-store' }
      content:
        text/html:
          schema:
            { type: string, description: Generic sandboxed error document posting pagent:error. }
        application/json:
          schema: { $ref: '#/components/schemas/DocumentError' }
    HtmlDocument:
      description: |
        Full HTML plus an invisible telemetry bridge. Stored UTF-8 source is
        unchanged. Display is triggered by iframe load, not bridge readiness;
        author CSP can block the bridge and prevent metrics without hiding
        content. Serve only in a sandboxed document frame. CSP uses
        `sandbox allow-scripts` without `allow-same-origin`; author code has no
        Pagent account-cookie/storage or parent-DOM access. The supported
        document is self-contained HTML/CSS/inline JavaScript. CSP and sandbox
        restrict external assets, network APIs, forms, nested frames, popups,
        top navigation, eval, and workers. Parent frame policy blocks external
        navigation; this is not a blanket guarantee against any attempted
        browser network request.
      headers:
        Cache-Control:
          schema: { type: string, const: 'private, no-store' }
        Referrer-Policy:
          schema: { type: string, const: no-referrer }
        Content-Security-Policy:
          description: Restrictive document CSP including sandbox and allowlisted frame ancestors.
          schema: { type: string }
        X-Content-Type-Options:
          schema: { type: string, const: nosniff }
      content:
        text/html:
          schema: { type: string }

  headers:
    XRequestId:
      description: >
        A unique identifier for this request (32-character lowercase hex or a
        client-supplied value up to 128 characters). Quote it in bug reports —
        the same ID appears on every log line for that request.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,128}$'
    RetryAfter:
      description: Seconds to wait before the next attempt (RFC 7231).
      schema:
        type: integer
        minimum: 1

  schemas:
    DocumentError:
      type: object
      required: [error]
      description: Existing JSON error shape; extra fields depend on the error, such as retry_after_seconds.
      properties:
        error: { type: string }
    WorkspaceMember:
      type: object
      additionalProperties: false
      required: [id, email, handle, role, status]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        handle: { type: [string, 'null'] }
        role: { type: string, enum: [owner, admin, member] }
        status: { type: string, enum: [active, suspended, left] }

    WorkspaceAdminView:
      type: object
      additionalProperties: false
      required: [workspace, pages, members, teams, recentAuditEvents]
      properties:
        workspace:
          type: object
          additionalProperties: false
          required:
            [
              id,
              name,
              role,
              verifiedDomains,
              analyticsConsentRequired,
              analyticsRetentionDays,
              pageCount,
            ]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            role: { type: string, enum: [owner, admin] }
            verifiedDomains: { type: array, items: { type: string } }
            analyticsConsentRequired: { type: boolean }
            analyticsRetentionDays: { type: integer, minimum: 30, maximum: 2555 }
            pageCount: { type: integer, minimum: 0 }
        pages:
          type: array
          maxItems: 100
          description: Recent durable page metadata. Slide content and viewer analytics are never included.
          items:
            $ref: '#/components/schemas/WorkspacePageMetadata'
        members:
          type: array
          items: { $ref: '#/components/schemas/WorkspaceMember' }
        teams:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, memberIds]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              memberIds: { type: array, items: { type: string, format: uuid } }
        recentAuditEvents:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, action, actorEmail, details, createdAt]
            properties:
              id: { type: string, format: uuid }
              action: { type: string }
              actorEmail: { type: [string, 'null'], format: email }
              details: {}
              createdAt: { type: string, format: date-time }

    WorkspacePageMetadata:
      type: object
      additionalProperties: false
      required: [id, title, status, ownerEmail, latestSenderEmail, linkCount, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        status: { type: string, enum: [active, archived] }
        ownerEmail: { type: string, format: email }
        latestSenderEmail: { type: [string, 'null'], format: email }
        linkCount: { type: integer, minimum: 0 }
        updatedAt: { type: string, format: date-time }

    WorkspaceMemberRequest:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { type: string, enum: [admin, member] }

    WorkspacePolicyRequest:
      type: object
      additionalProperties: false
      required: [consentRequired, retentionDays]
      properties:
        consentRequired: { type: boolean }
        retentionDays: { type: integer, minimum: 30, maximum: 2555 }

    PublishDeckRequest:
      description: Publish full HTML; legacy slides remain a REST-only compatibility form.
      oneOf:
        - $ref: '#/components/schemas/HtmlPublishDeckRequest'
        - $ref: '#/components/schemas/LegacySlidesPublishDeckRequest'

    HtmlPublishDeckRequest:
      type: object
      additionalProperties: false
      required: [title, html]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 2000 }
        client_label: { type: string, maxLength: 160 }
        update_deck_id: { type: string, format: uuid }
        html:
          type: string
          minLength: 1
          maxLength: 1000000
          description: |
            Exact full HTML source, capped at 1,000,000 UTF-8 bytes without
            trimming or sanitization. NUL characters are rejected. The overall HTTP body has the same byte
            cap, so JSON escaping and metadata can lower the effective limit.
            Use self-contained CSS/inline JavaScript; see protected document
            delivery for sandbox restrictions. No slide structure is inferred.

    LegacySlidesPublishDeckRequest:
      description: Compatibility with shipped REST clients; not the advertised MCP write contract.
      type: object
      additionalProperties: false
      required: [title, slides]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 2000 }
        client_label: { type: string, maxLength: 160 }
        update_deck_id: { type: string, format: uuid }
        slides:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [id, html]
            properties:
              id: { type: string, maxLength: 120, pattern: '^[a-zA-Z0-9][a-zA-Z0-9._-]*$' }
              title: { type: string, maxLength: 200 }
              html: { type: string, minLength: 1, maxLength: 1000000 }

    PublishedDeck:
      type: object
      required: [deckId, revisionId, revisionNumber]
      properties:
        deckId: { type: string, format: uuid }
        revisionId: { type: string, format: uuid }
        revisionNumber: { type: integer, minimum: 1 }

    DeckDetail:
      type: object
      required:
        [
          id,
          title,
          description,
          clientLabel,
          status,
          ownerId,
          ownerEmail,
          analyticsVisibility,
          latestRevisionNumber,
          createdAt,
          updatedAt,
          lastPublishedAt,
          revisions,
          recentActivity,
        ]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, 'null'] }
        clientLabel: { type: [string, 'null'] }
        status: { type: string, enum: [active, archived] }
        ownerId: { type: string, format: uuid }
        ownerEmail: { type: string, format: email }
        analyticsVisibility: { type: string, enum: [private, selected, team, workspace] }
        latestRevisionNumber: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastPublishedAt: { type: string, format: date-time }
        revisions:
          type: array
          description: Retained immutable revision metadata, newest first; not a historical preview/restore endpoint.
          items:
            type: object
            required: [id, revisionNumber, contentFormat, slideCount, createdByEmail, createdAt]
            properties:
              id: { type: string, format: uuid }
              revisionNumber: { type: integer, minimum: 1 }
              contentFormat: { type: string, enum: [html, slides] }
              slideCount:
                {
                  type: integer,
                  minimum: 0,
                  description: Zero for HTML revisions; no slides are inferred.,
                }
              createdByEmail: { type: string, format: email }
              createdAt: { type: string, format: date-time }
        recentActivity:
          type: array
          items:
            type: object
            required: [id, action, actorEmail, createdAt]
            properties:
              id: { type: string, format: uuid }
              action: { type: string }
              actorEmail: { type: [string, 'null'], format: email }
              createdAt: { type: string, format: date-time }

    DeckSlide:
      type: object
      description: Existing sanitized legacy slide; HTML revisions never fabricate these records.
      required: [id, stableSlideId, ordinal, title, html]
      properties:
        id: { type: string, format: uuid }
        stableSlideId: { type: string }
        ordinal: { type: integer, minimum: 1 }
        title: { type: [string, 'null'] }
        html: { type: string }

    DeckPreview:
      type: object
      required: [deckId, title, revisionId, revisionNumber, html, slides]
      properties:
        deckId: { type: string, format: uuid }
        title: { type: string }
        revisionId: { type: string, format: uuid }
        revisionNumber: { type: integer, minimum: 1 }
        html:
          type: [string, 'null']
          description: Exact source for HTML revisions; null for legacy slides.
        slides:
          type: array
          description: Empty for HTML revisions.
          items: { $ref: '#/components/schemas/DeckSlide' }

    ViewerDeck:
      type: object
      required:
        [
          deckId,
          deckTitle,
          revisionId,
          revisionNumber,
          html,
          shareLinkId,
          viewerSessionId,
          identityConfidence,
          preview,
          slides,
        ]
      properties:
        deckId: { type: string, format: uuid }
        deckTitle: { type: string }
        revisionId: { type: string, format: uuid }
        revisionNumber: { type: integer, minimum: 1 }
        html:
          type: [string, 'null']
          description: Exact source for HTML revisions; null for legacy slides.
        shareLinkId: { type: string, format: uuid }
        viewerSessionId: { type: string, format: uuid }
        identityConfidence: { type: string, enum: [anonymous, unverified, authenticated] }
        preview: { type: boolean }
        slides:
          type: array
          description: Empty for HTML revisions.
          items: { $ref: '#/components/schemas/DeckSlide' }

    DeckAnalytics:
      type: object
      required: [owner, contentFormat, revisionNumbers, overview, visitors, slides, visits]
      properties:
        owner:
          type: object
          required: [id, email]
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }
        contentFormat:
          type: string
          enum: [html, slides, mixed]
          description: Formats among retained revisions matching the revision filter, including revisions without matching visits.
        revisionNumbers:
          type: array
          description: Retained revisions matching the revision filter, newest first; includes revisions without matching visits.
          items: { type: integer, minimum: 1 }
        overview:
          type: object
          required:
            [
              totalVisits,
              uniqueViewers,
              lastViewed,
              averageActiveTimeMs,
              averageCompletion,
              topSlide,
            ]
          properties:
            totalVisits: { type: integer, minimum: 0 }
            uniqueViewers: { type: integer, minimum: 0 }
            lastViewed: { type: [string, 'null'], format: date-time }
            averageActiveTimeMs: { type: number, minimum: 0 }
            averageCompletion:
              type: [number, 'null']
              minimum: 0
              maximum: 1
              description: Known legacy slide completions only; HTML visits are excluded, not zero. Null for HTML-only scope.
            topSlide:
              oneOf:
                - $ref: '#/components/schemas/SlideRollup'
                - type: 'null'
        visitors:
          type: array
          items:
            type: object
            required:
              [
                viewer,
                identityConfidence,
                firstVisit,
                lastVisit,
                visits,
                totalActiveTimeMs,
                maximumCompletion,
              ]
            properties:
              viewer: { type: string }
              identityConfidence: { type: string, enum: [anonymous, unverified, authenticated] }
              firstVisit: { type: string, format: date-time }
              lastVisit: { type: string, format: date-time }
              visits: { type: integer, minimum: 1 }
              totalActiveTimeMs: { type: number, minimum: 0 }
              maximumCompletion:
                type: [number, 'null']
                minimum: 0
                maximum: 1
                description: Null when no legacy slide completion is known.
        slides:
          type: array
          description: Legacy slide rollups only; empty for HTML-only scope.
          items: { $ref: '#/components/schemas/SlideRollup' }
        visits:
          type: array
          items: { $ref: '#/components/schemas/AnalyticsVisit' }

    SlideRollup:
      type: object
      required:
        [
          slideId,
          stableSlideId,
          revisionNumber,
          ordinal,
          title,
          uniqueViewers,
          viewRate,
          averageActiveTimeMs,
          totalActiveTimeMs,
          exits,
        ]
      properties:
        slideId: { type: string, format: uuid }
        stableSlideId: { type: string }
        revisionNumber: { type: integer, minimum: 1 }
        ordinal: { type: integer, minimum: 1 }
        title: { type: [string, 'null'] }
        uniqueViewers: { type: integer, minimum: 0 }
        viewRate:
          type: number
          minimum: 0
          maximum: 1
          description: Qualified unique viewers divided by unique viewers of this legacy slide revision, within the selected filters. Zero when the revision has no viewers.
        averageActiveTimeMs: { type: number, minimum: 0 }
        totalActiveTimeMs: { type: number, minimum: 0 }
        exits: { type: integer, minimum: 0 }

    AnalyticsVisit:
      type: object
      required:
        [
          id,
          viewer,
          identityConfidence,
          startedAt,
          lastActivityAt,
          linkId,
          linkName,
          senderId,
          senderEmail,
          revisionNumber,
          totalActiveTimeMs,
          contentFormat,
          viewedSlides,
          completion,
          furthestSlide,
          lastSlide,
          sequenceComplete,
          slideSequence,
        ]
      properties:
        id: { type: string, format: uuid }
        viewer: { type: string }
        identityConfidence: { type: string, enum: [anonymous, unverified, authenticated] }
        startedAt: { type: string, format: date-time }
        lastActivityAt: { type: string, format: date-time }
        linkId: { type: string, format: uuid }
        linkName: { type: string }
        senderId: { type: string, format: uuid }
        senderEmail: { type: string, format: email }
        revisionNumber: { type: integer, minimum: 1 }
        totalActiveTimeMs: { type: number, minimum: 0 }
        contentFormat: { type: string, enum: [html, slides] }
        viewedSlides: { type: [integer, 'null'], minimum: 0, description: Null for HTML. }
        completion: { type: [number, 'null'], minimum: 0, maximum: 1, description: Null for HTML. }
        furthestSlide: { type: [integer, 'null'], minimum: 0, description: Null for HTML. }
        lastSlide: { type: [integer, 'null'], minimum: 0, description: Null for HTML. }
        sequenceComplete: { type: boolean }
        slideSequence:
          type: array
          description: Empty for HTML visits.
          items:
            type: object
            required: [slideId, ordinal, title, activeDurationMs, viewCount]
            properties:
              slideId: { type: string, format: uuid }
              ordinal: { type: integer, minimum: 1 }
              title: { type: [string, 'null'] }
              activeDurationMs: { type: number, minimum: 0 }
              viewCount: { type: integer, minimum: 0 }

    ShareLinkRequest:
      type: object
      additionalProperties: false
      required: [name, access_mode]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        access_mode: { type: string, enum: [anyone, allowed_email, authenticated] }
        allowed_emails: { type: array, maxItems: 500, items: { type: string, format: email } }
        allowed_domains: { type: array, maxItems: 100, items: { type: string, maxLength: 255 } }
        expires_at: { type: string, format: date-time }

    AnalyticsFilters:
      type: object
      additionalProperties: false
      properties:
        link_id: { type: string, format: uuid }
        viewer:
          {
            type: string,
            maxLength: 320,
            description: Sent in JSON so raw emails never enter analytics URLs.,
          }
        sender: { type: string, format: uuid }
        revision: { type: integer, minimum: 1 }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }

    AnalyticsVisibilityRequest:
      type: object
      additionalProperties: false
      required: [scope, subjectIds]
      properties:
        scope: { type: string, enum: [private, selected, team, workspace] }
        subjectIds: { type: array, items: { type: string, format: uuid } }

    StartVisitRequest:
      type: object
      additionalProperties: false
      required: [visible, interacted, analyticsConsent, deviceClass, browserFamily, countryCode]
      properties:
        revisionId:
          type: string
          format: uuid
          description: Displayed revision to bind this visit to; omitted by legacy clients to use latest.
        visible:
          { type: boolean, description: True only when the viewer is at least 50 percent visible. }
        interacted: { type: boolean }
        analyticsConsent: { type: boolean }
        deviceClass: { type: string, enum: [mobile, tablet, desktop, unknown] }
        browserFamily: { type: string, maxLength: 80 }
        countryCode: { type: [string, 'null'], minLength: 2, maxLength: 2 }

    EngagementBatch:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required:
              [
                id,
                eventType,
                eventAt,
                sequence,
                visibleRatio,
                visibleDurationMs,
                tabVisible,
                recentlyActive,
              ]
            properties:
              id: { type: string, format: uuid, description: Idempotency key. }
              eventType: { type: string, enum: [start, heartbeat, slide_view, close] }
              slideId:
                {
                  type: string,
                  format: uuid,
                  description: Legacy slide events only; omit for HTML visit-level events.,
                }
              eventAt: { type: string, format: date-time }
              sequence: { type: integer, minimum: 0 }
              visibleRatio: { type: number, minimum: 0, maximum: 1 }
              visibleDurationMs: { type: integer, minimum: 0, maximum: 60000 }
              tabVisible: { type: boolean }
              recentlyActive:
                {
                  type: boolean,
                  description: 'False after 60 seconds without mouse, touch, or keyboard activity.',
                }

    OAuthError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        error_description: { type: string }
        message: { type: string }

    MagicLinkRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        state:
          type: string
          description: >-
            Signed authorization state. Browser-session login receives it from
            `GET /oauth/authorize?browser_session=1`. An OAuth client receives
            the usable, consent-granted state in the HTML returned by
            `POST /oauth/authorize/consent`; the pre-consent state from the GET
            authorization page is rejected by this endpoint.

    OAuthTokenResponse:
      type: object
      required: [access_token, token_type, expires_in, refresh_token]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, minimum: 1 }
        refresh_token: { type: string }
        scope: { type: string }

    UserProfile:
      type: object
      required: [id, handle, email]
      properties:
        id: { type: string, format: uuid }
        handle: { type: [string, 'null'] }
        email: { type: string, format: email }
        name: { type: [string, 'null'] }
        avatar_url: { type: [string, 'null'], format: uri }

    PageId:
      type: string
      pattern: '^[a-f0-9]{32}$'
      description: 32-character lowercase hex identifier generated at page creation.
      example: c0f2ec161aac8b1a8d26222f45ca812d

    PageState:
      type: string
      enum: [open, submitted, received]
      description: |
        Lifecycle state of a page:
        - `open` — awaiting user submission.
        - `submitted` — user submitted; agent has not yet read the result.
        - `received` — agent has consumed the result via `GET /{id}/result`.

    Spec:
      description: >
        Page contents. Shape depends on the request's `format` field:
        `a2ui` (default) — an array of A2UI v0.9 messages; the service stores
        and returns this verbatim without parsing the structure.
        `html` — a UTF-8 HTML string up to 1,000,000 bytes; the service runs
        DOMPurify on the string at create time and stores the sanitised
        result.
      oneOf:
        - type: array
          description: A2UI v0.9 message array (when format is `a2ui`).
          items:
            type: object
            additionalProperties: true
        - type: string
          description: HTML body, up to 1,000,000 bytes (when format is `html`).
      example:
        - createSurface:
            surfaceId: main
            catalogId: https://a2ui.org/specification/v0_9/basic_catalog.json
        - updateComponents:
            surfaceId: main
            components: []

    PageFormat:
      type: string
      enum: [a2ui, html]
      description: |
        Spec format. `a2ui` (default) — `spec` is an A2UI v0.9 message array.
        `html` — `spec` is a UTF-8 HTML string up to 1,000,000 bytes; the
        page becomes view-only and never produces a result.

    NewPageRequest:
      type: object
      required: [spec]
      properties:
        spec:
          $ref: '#/components/schemas/Spec'
        format:
          type: string
          enum: [a2ui, html]
          default: a2ui
          description: |
            Spec format. `a2ui` (default) — `spec` is an A2UI v0.9 message array.
            `html` — `spec` is a UTF-8 HTML string up to 1,000,000 bytes; the
            page becomes view-only and never produces a result.

    NewPageResponse:
      type: object
      required: [id, url, expires_at]
      properties:
        id:
          $ref: '#/components/schemas/PageId'
        url:
          type: string
          format: uri
          description: >
            Short URL for the user to open in a browser. Points to the
            Pagent renderer with this page's ID.
          example: https://pagent.link/c0f2ec161aac8b1a8d26222f45ca812d
        expires_at:
          type: integer
          description: Unix epoch milliseconds when this page will be deleted.
          example: 1709122000000

    PageResponse:
      type: object
      required: [spec, format, state, result, expires_at]
      properties:
        spec:
          $ref: '#/components/schemas/Spec'
        format:
          $ref: '#/components/schemas/PageFormat'
        state:
          $ref: '#/components/schemas/PageState'
        result:
          type: object
          nullable: true
          description: >
            The submitted A2UI action, or null if the page is still open or
            if the page is an HTML page (HTML pages never produce a result).
            Shape mirrors `ResultRequest`.
        expires_at:
          type: integer
          description: Unix epoch milliseconds when this page will be deleted.
          example: 1709122000000

    ResultRequest:
      type: object
      required: [name, surfaceId]
      additionalProperties: true
      description: >
        An A2UI action object. Extra fields beyond those listed here are
        preserved verbatim (`.passthrough()` behaviour).
      properties:
        name:
          type: string
          minLength: 1
          description: Event name emitted by the A2UI component.
          example: submitted
        surfaceId:
          type: string
          minLength: 1
          description: ID of the surface that emitted the action.
          example: main
        sourceComponentId:
          type: string
          description: ID of the component that triggered the action.
          example: submit-btn
        context:
          type: object
          additionalProperties: true
          description: Arbitrary key/value pairs captured from the form state.
          example:
            color: blue
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp of when the action was triggered.
          example: '2024-01-15T12:34:56.789Z'

    ResultResponse:
      type: object
      required: [state, result, format]
      properties:
        state:
          $ref: '#/components/schemas/PageState'
        format:
          $ref: '#/components/schemas/PageFormat'
        result:
          type: object
          nullable: true
          description: >
            The submitted A2UI action, or null if the page is still `open`.
            HTML pages always return null here — they never produce a result.

    SubmitOk:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]

    HealthOk:
      type: object
      required: [ok, db]
      properties:
        ok:
          type: boolean
          enum: [true]
        db:
          type: string
          enum: [ok]

    HealthError:
      type: object
      required: [ok, db, message]
      properties:
        ok:
          type: boolean
          enum: [false]
        db:
          type: string
          enum: [error]
        message:
          type: string
          description: Human-readable description of the failure.
          example: Database connection failed

    Error400:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum: [bad_request, invalid_for_format, sanitized_empty]
          description: |
            `bad_request` — body is malformed or fails schema validation.
            `invalid_for_format` — operation is not supported for this page's
            format (e.g. POSTing a result to an HTML page).
            `sanitized_empty` — `POST /new` with `format: "html"` whose payload
            was reduced to empty by the sanitizer (only forbidden tags like
            `<script>` or `<iframe>` were supplied). Re-author the HTML with
            safe markup and inline styles.
        format:
          type: string
          enum: [a2ui, html]
          description: |
            Present on `invalid_for_format` and `sanitized_empty` errors —
            identifies which format triggered the rejection.
        message:
          type: string
          description: Human-readable description of why the request was rejected.
          example: Request body did not match the expected schema
        issues:
          type: array
          description: Zod validation issues describing what failed.
          items:
            type: object
            additionalProperties: true

    Error404:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum: [not_found]
        message:
          type: string
          description: Human-readable description of what was not found.
          example: Page not found or expired

    Error409:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum: [conflict]
        message:
          type: string
          description: Human-readable description of the conflict.
          example: Page was already submitted; create a new page if you need another submission

    Error413:
      type: object
      required: [error, max_bytes, message]
      properties:
        error:
          type: string
          enum: [payload_too_large]
        format:
          type: string
          enum: [a2ui, html]
          description: |
            The format whose size cap was exceeded. `a2ui` caps at 256 000 bytes
            (enforced post-parse). `html` caps at 1 000 000 bytes (enforced by
            the body-limit middleware before parse).
        max_bytes:
          type: integer
          description: Maximum allowed body size in bytes for this format.
          example: 256000
        message:
          type: string
          description: Human-readable description of the size limit.
          example: A2UI spec exceeds the 256 KB limit; use format "html" for larger payloads only when appropriate

    Error429:
      type: object
      required: [error, retry_after_seconds, message]
      properties:
        error:
          type: string
          enum: [rate_limited]
        retry_after_seconds:
          type: integer
          description: Seconds to wait before retrying.
          example: 60
        message:
          type: string
          description: Human-readable rate limit message including the retry delay.
          example: Too many requests; retry after 60 seconds

    Error500:
      type: object
      required: [error, request_id, message]
      properties:
        error:
          type: string
          enum: [internal_error]
        request_id:
          type: string
          description: >
            The `X-Request-ID` for this request. Quote it in bug reports so
            maintainers can locate the matching log lines and traces.
          example: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
        message:
          type: string
          description: Human-readable description of the error. Always safe to show to users.
          example: An unexpected error occurred; quote the request_id when reporting this
