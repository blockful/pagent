openapi: 3.1.0
info:
  title: Pagent API
  version: 0.1.0
  description: |
    Page publishing for AI agents. MCP exposes exactly `write` and `read`:
    temporary interactive/document pages and durable HTML presentation pages.
    Sharing, permissions, and management use the authenticated web app and
    REST API. Internal deck route names are not another product primitive.

    The `format` field on temporary-page `POST /new` selects the renderer:
    - `a2ui` (default) — `spec` is an A2UI v0.9 message array. Pages take user
      input and produce a result.
    - `html` — `spec` is a sanitized, script-free UTF-8 HTML string
      (up to 1,000,000 bytes). Pages are view-only: they never transition past `open`, and
      `POST /{id}/result` returns 400 `invalid_for_format`.

    Durable `POST /v1/decks` accepts `title` and the complete `html` document,
    preserving the exact source in an immutable revision. Optional
    `update_deck_id` corresponds to MCP `write`'s `page_id`. Legacy `slides`
    remain accepted only for shipped clients and records. HTML runs in an
    opaque-origin sandbox with inline scripts, not the temporary sanitizer.
    HTML analytics report visits/active time, not inferred slide completion.

    See https://github.com/blockful/pagent for the source.

    ## Temporary page lifecycle

    An interactive page walks a 3-state machine: `open → submitted → received`.

    - **open** — created, waiting for a browser submission.
    - **submitted** — the browser has called `POST /{id}/result`. The agent
      has not yet read the result.
    - **received** — the agent called `GET /{id}/result` at least once after
      submission. The state flip is idempotent; subsequent reads keep returning
      `received`.

    ## Authentication modes

    When `REQUIRE_AUTH=false` (rollout grace mode), anonymous requests to
    `POST /new` and `GET /{id}/result` are allowed. OAuth scope checks still
    apply whenever a valid Bearer token is presented: an under-scoped token
    receives 403 even though the same request without credentials is allowed.
    When `REQUIRE_AUTH=true`, both routes also require an authenticated user.
    `GET /{id}` and browser submissions to `POST /{id}/result` remain public.
  contact:
    name: Pagent maintainers
    url: https://github.com/blockful/pagent
  license:
    name: MIT
    url: https://github.com/blockful/pagent/blob/main/LICENSE

servers:
  - url: https://api.pagent.link
    description: Production
  - url: http://localhost:8787
    description: Local development

paths:
  /health:
    get:
      operationId: getHealth
      tags: [Operations]
      summary: Liveness probe with DB connectivity check
      description: |
        Returns 200 when the service and its Postgres connection are healthy.
        Returns 503 when Postgres is unreachable. Railway polls this endpoint
        and restarts the container on 503.

        This endpoint is **not** part of the versioned API contract — it is
        an ops endpoint and may change without notice.
      responses:
        '200':
          description: Service and database are healthy.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOk'
              example:
                ok: true
                db: ok
        '503':
          description: |
            Postgres is unreachable. Check the database connection string and
            the Postgres service status before retrying.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthError'
              example:
                ok: false
                db: error
                message: Database connection failed

  /openapi.json:
    get:
      operationId: getOpenapiJson
      tags: [Operations]
      summary: OpenAPI 3.1 spec (JSON — canonical machine-readable form)
      description: |
        Returns the canonical OpenAPI 3.1 document as `application/json`.
        Parsed once at boot from `docs/openapi.yaml` and cached in memory.
        This is the URL that tooling (Postman, Insomnia, OpenAPI Generator,
        Stoplight) expects to fetch. Returns 503 if the source file was
        missing at boot.
      responses:
        '200':
          description: The OpenAPI document as JSON.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
        '503':
          description: |
            `docs/openapi.yaml` was not found at boot. Ensure the file is
            present in the repository and deployed alongside the API.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [openapi_unavailable]

  /openapi.yaml:
    get:
      operationId: getOpenapiYaml
      tags: [Operations]
      summary: OpenAPI 3.1 spec (YAML — human-readable courtesy copy)
      description: |
        Returns the same OpenAPI 3.1 document as `application/yaml`.
        Served raw from memory (no re-serialisation). Useful for humans
        who prefer YAML. Tooling should prefer `/openapi.json`.
        Returns 503 if the source file was missing at boot.
      responses:
        '200':
          description: The OpenAPI document as YAML.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/yaml:
              schema:
                type: string
        '503':
          description: |
            `docs/openapi.yaml` was not found at boot. Ensure the file is
            present in the repository and deployed alongside the API.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [openapi_unavailable]

  /docs:
    get:
      operationId: getApiDocs
      tags: [Operations]
      summary: Interactive Scalar API Reference
      description: |
        Returns an HTML page rendering the Pagent API Reference via Scalar.
        Scalar fetches `/openapi.json` client-side and renders an interactive
        explorer — no build step required. Opens directly in a browser.
      responses:
        '200':
          description: The Scalar API Reference HTML page.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            text/html:
              schema:
                type: string

  /.well-known/oauth-authorization-server:
    get:
      operationId: getOAuthAuthorizationServerMetadata
      tags: [Auth]
      summary: OAuth 2.1 authorization-server metadata
      responses:
        '200':
          description: OAuth issuer, endpoints, grants, PKCE methods, and supported scopes.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /.well-known/oauth-protected-resource:
    get:
      operationId: getOAuthProtectedResourceMetadata
      tags: [Auth]
      summary: OAuth protected-resource metadata for API and MCP clients
      responses:
        '200':
          description: Resource identifier, authorization server, bearer method, and scopes.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /.well-known/jwks.json:
    get:
      operationId: getJsonWebKeySet
      tags: [Auth]
      summary: Public Ed25519 keys used to verify Pagent access tokens
      responses:
        '200':
          description: JSON Web Key Set.
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      additionalProperties: true

  /oauth/register:
    post:
      operationId: registerOAuthClient
      tags: [Auth]
      summary: Dynamically register a public OAuth client
      description: |
        Rate-limited to 10 registrations per source IP per hour. Redirect URIs
        must use HTTPS, except explicit HTTP loopback addresses; custom
        application schemes are supported for native clients.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [redirect_uris]
              additionalProperties: true
              properties:
                redirect_uris:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: uri
                client_name:
                  type: string
      responses:
        '201':
          description: Registered OAuth client metadata, including its generated client ID.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid client metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '429':
          description: Registration rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429'

  /oauth/authorize:
    get:
      operationId: authorizeOAuthClient
      tags: [Auth]
      summary: Start an OAuth authorization-code flow or browser session
      description: |
        OAuth clients supply `response_type=code`, `client_id`, `redirect_uri`,
        an S256 PKCE challenge, and optional scopes/state. The renderer uses
        `browser_session=1` to start
        its cookie-backed browser login. OAuth-client requests return a local,
        cookie-bound consent page that identifies the unverified client, exact
        return destination, and requested scopes before any sign-in provider is
        exposed. Browser-session requests return the sign-in page directly.
      parameters:
        - name: response_type
          in: query
          description: Required and must be `code` for OAuth-client requests; omitted for `browser_session=1`.
          schema: { type: string, enum: [code] }
        - name: client_id
          in: query
          schema: { type: string }
        - name: redirect_uri
          in: query
          schema: { type: string, format: uri }
        - name: code_challenge
          in: query
          schema: { type: string }
        - name: code_challenge_method
          in: query
          schema: { type: string, enum: [S256] }
        - name: scope
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
        - name: browser_session
          in: query
          schema: { type: string, enum: ['1'] }
      responses:
        '200':
          description: HTML OAuth consent page or browser-session login page.
          content:
            text/html:
              schema: { type: string }
        '400':
          description: HTML error page for missing, unsupported, or unsafe OAuth request parameters.
          content:
            text/html:
              schema: { type: string }
        '429':
          description: Authorization rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429'

  /oauth/authorize/consent:
    post:
      operationId: decideOAuthConsent
      tags: [Auth]
      summary: Allow or cancel a pending OAuth authorization request
      description: |
        Verifies the signed pending request and its HttpOnly browser transaction.
        Allowing re-signs the request as consented and renders Google and magic-link
        sign-in choices. Cancelling clears the transaction and renders a local
        confirmation; it never redirects the unauthenticated browser to the client.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [state, decision]
              properties:
                state:
                  type: string
                decision:
                  type: string
                  enum: [allow, cancel]
      responses:
        '200':
          description: HTML sign-in choices after Allow, or a local cancellation page.
          content:
            text/html:
              schema: { type: string }
        '400':
          description: HTML error page for an invalid, expired, or unbound transaction.
          content:
            text/html:
              schema: { type: string }

  /oauth/callback/google:
    get:
      operationId: completeGoogleAuthorization
      tags: [Auth]
      summary: Complete Google sign-in
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Redirect to the consented OAuth client with a code, or to the renderer after browser login.
        '400':
          description: HTML error page for an invalid or expired authorization transaction.
          content:
            text/html:
              schema: { type: string }

  /oauth/magic/send:
    post:
      operationId: sendMagicLink
      tags: [Auth]
      summary: Send a single-use magic sign-in link
      description: >-
        Accepts JSON or form data and applies per-email, per-client-IP, and
        process-wide provider safeguards.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MagicLinkRequest'
      responses:
        '200':
          description: The link was accepted for delivery.
          content:
            application/json:
              schema:
                type: object
                required: [ok, message]
                properties:
                  ok: { type: boolean, enum: [true] }
                  message: { type: string }
        '400':
          description: Invalid email or malformed request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '429':
          description: Per-email, per-client-IP, or provider-capacity limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429'
        '503':
          description: SMTP is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'

  /oauth/magic:
    get:
      operationId: completeMagicLinkAuthorization
      tags: [Auth]
      summary: Consume a single-use magic sign-in link
      description: |
        Inspects the link before consuming it. Browser-session and OAuth links
        must carry the matching HttpOnly browser transaction; OAuth links also
        require prior explicit consent and a still-valid registered redirect.
        An unbound email scanner receives an HTML 400 response without consuming
        the one-time link, so the intended browser can still complete sign-in.
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Redirect to the OAuth client with a code, or to the renderer after browser login.
        '400':
          description: HTML error page for a missing, invalid, expired, already-used, or browser-unbound link. Browser-binding failures do not consume an otherwise active link.
          content:
            text/html:
              schema: { type: string }

  /oauth/token:
    post:
      operationId: exchangeOAuthToken
      tags: [Auth]
      summary: Exchange an authorization code or rotate a refresh token
      description: Public-client OAuth token endpoint. Authorization codes require S256 PKCE.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, client_id]
              properties:
                grant_type:
                  type: string
                  enum: [authorization_code, refresh_token]
                client_id: { type: string }
                code: { type: string }
                redirect_uri: { type: string, format: uri }
                code_verifier: { type: string }
                refresh_token: { type: string }
      responses:
        '200':
          description: Access token and refresh token.
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResponse'
        '400':
          description: Invalid request, grant, client, or unsupported grant type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '401':
          description: Unknown OAuth client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '429':
          description: Token endpoint rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429'

  /oauth/revoke:
    post:
      operationId: revokeOAuthToken
      tags: [Auth]
      summary: Revoke a refresh token family
      description: Returns 200 even when the token is unknown, as required by RFC 7009.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                token_type_hint: { type: string }
                client_id: { type: string }
      responses:
        '200':
          description: Revocation request accepted.
        '429':
          description: Revocation endpoint rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429'

  /auth/me:
    get:
      operationId: getCurrentBrowserUser
      tags: [Auth]
      summary: Return the current cookie-authenticated browser user
      security:
        - CookieAuth: []
      responses:
        '200':
          description: Current user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Missing, expired, or invalid browser session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'

  /auth/logout:
    post:
      operationId: logoutBrowserSession
      tags: [Auth]
      summary: Revoke and clear the current browser session
      security:
        - CookieAuth: []
        - {}
      responses:
        '200':
          description: Session cleared; idempotent when no cookie is present.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, enum: [true] }

  /new:
    post:
      operationId: createPage
      tags: [Pages]
      summary: Create a new page
      description: |
        Creates a new page from a spec and returns a short URL to share
        with the user. The page starts in state `open`.

        The `format` field (default `a2ui`) selects the spec shape:
        - `a2ui` — `spec` is an A2UI v0.9 message array. The service stores
          and serves it back verbatim. Pages collect user input and produce a
          result.
        - `html` — `spec` is a UTF-8 HTML string (up to 1,000,000 bytes). The
          service sanitises it with DOMPurify before storage. Pages are
          view-only: they never transition past `open`, and
          `POST /{id}/result` returns 400 `invalid_for_format`.

        **What to do next:** print the returned `url` in the terminal (or chat)
        so the user can open it in a browser. For A2UI pages, poll
        `GET /{id}/result` until `state` is no longer `open`. For HTML pages,
        there is nothing to poll for — once the user opens the URL, you are
        done.

        Rate-limited to 30 requests per minute per source IP.

        In rollout grace mode (`REQUIRE_AUTH=false`), anonymous creation is
        allowed. A valid Bearer token is still required to include
        `page:create`; otherwise this route returns 403.
      security:
        - BearerAuth: []
        - CookieAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPageRequest'
            example:
              spec:
                - createSurface:
                    surfaceId: main
                    catalogId: https://a2ui.org/specification/v0_9/basic_catalog.json
                - updateComponents:
                    surfaceId: main
                    components: []
      responses:
        '201':
          description: Page created. Open the returned URL in a browser.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewPageResponse'
        '400':
          description: |
            Request body is malformed or missing the `spec` field.
            Fix the request before retrying.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '413':
          description: |
            Request body exceeds the service limit. A2UI specs cap at
            256 000 bytes (post-parse); HTML payloads cap at 1 000 000 bytes
            (wire body limit). The response's `format` field tells you which
            cap fired so you can size the next submission appropriately.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error413'
              example:
                error: payload_too_large
                format: a2ui
                max_bytes: 256000
                message: A2UI spec exceeds the 256 KB limit; use format "html" for larger payloads only when appropriate
        '401':
          description: Authentication is required when `REQUIRE_AUTH=true`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '403':
          description: |
            A valid Bearer token is missing the `page:create` scope. Scope
            checks apply even in rollout grace mode, when an anonymous request
            would be allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '429':
          description: |
            Per-IP rate limit exceeded. Wait `retry_after_seconds` seconds
            before retrying. The `Retry-After` response header carries the
            same value in seconds (RFC 7231).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429'
              example:
                error: rate_limited
                retry_after_seconds: 60
        '500':
          description: |
            Unexpected server error. Quote the `request_id` from the response
            body (or the `X-Request-ID` header — they are identical) in any
            bug report. Do not retry in a tight loop; this is unlikely to
            self-heal without a deployment.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'

  /v1/workspace:
    get:
      operationId: getWorkspaceAdmin
      tags: [Workspace]
      summary: Get the current owner or admin workspace governance view
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      responses:
        '200':
          description: Workspace policy, page metadata, membership, teams, and recent audit activity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceAdminView' }
        '401': { description: Authentication required. }
        '403': { description: Active owner or admin membership required. }

  /v1/workspace/members:
    post:
      operationId: addWorkspaceMember
      tags: [Workspace]
      summary: Add or reactivate an existing Pagent user
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceMemberRequest' }
      responses:
        '201':
          description: Active workspace membership.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceMember' }
        '400': { description: Invalid email or role. }
        '401': { description: Authentication required. }
        '403': { description: Active owner or admin membership required. }
        '404': { description: No existing Pagent user has that email. }

  /v1/workspace/members/{memberId}:
    delete:
      operationId: suspendWorkspaceMember
      tags: [Workspace]
      summary: Suspend a non-owner workspace member and revoke page grants
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      parameters:
        - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Member suspended. }
        '401': { description: Authentication required. }
        '403':
          { description: Cannot remove an owner, yourself, or a member outside this workspace. }
        '404': { description: Invalid member identifier. }

  /v1/workspace/policy:
    put:
      operationId: updateWorkspacePolicy
      tags: [Workspace]
      summary: Update analytics consent and retention policy
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspacePolicyRequest' }
      responses:
        '204': { description: Policy updated. }
        '400': { description: Invalid policy. }
        '401': { description: Authentication required. }
        '403': { description: Active owner or admin membership required. }

  /v1/decks:
    get:
      operationId: listDecks
      tags: [Decks]
      summary: List searchable decks visible to the authenticated member
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - {
            name: scope,
            in: query,
            schema: { type: string, enum: [mine, shared, team], default: mine },
          }
        - {
            name: status,
            in: query,
            schema: { type: string, enum: [active, archived, expired, revoked] },
          }
        - { name: owner, in: query, schema: { type: string, format: uuid } }
        - { name: sender, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Deck summaries including owner, sender, link, and analytics rollups. }
        '401': { description: Authentication required. }
    post:
      operationId: publishDeck
      tags: [Decks]
      summary: Publish a durable deck or immutable revision
      description: |
        Publish the submitted HTML document itself, without a Pagent slide
        structure. HTML source is retained exactly; CSS and inline JavaScript
        execute only in the protected document sandbox. The `slides` variant
        is a legacy REST compatibility path and retains sanitization.
        Exactly one of `html` or `slides` is required. The HTML value is capped
        at 1,000,000 UTF-8 bytes; the overall HTTP body is also capped at
        1,000,000 bytes, so JSON escaping and metadata reduce the usable payload.
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishDeckRequest' }
      responses:
        '200':
          description: Existing deck updated with a new immutable revision.
