  /v1/viewer/deck:
    get:
      operationId: getViewerDeck
      tags: [Viewer]
      summary: Fetch the latest revision for a live viewer session
      description: |
        HTML revisions return exact `html` and an empty `slides` array; legacy
        revisions return `html: null` and their existing slides. Render HTML
        only through `POST /v1/viewer/document`, not the parent application's DOM.
      parameters: [{ $ref: '#/components/parameters/ViewerSession' }]
      responses:
        '200':
          description: HTML or legacy slide content and identity confidence.
          content: { application/json: { schema: { $ref: '#/components/schemas/ViewerDeck' } } }
        '410': { description: Session expired, revoked, or deck deleted. }

  /v1/viewer/document:
    post:
      operationId: getViewerDocument
      tags: [Viewer]
      summary: Deliver protected HTML into the viewer's isolated frame
      description: |
        Submit a form to the document frame using the existing viewer session.
        The exact Origin header must match an allowlisted renderer origin.
        No `allowed_origin` body field or new frame token is accepted. All
        existing Anyone, Allowed email (Unverified), and Authenticated access
        rules still apply. Credentials must not appear in URLs or served HTML.
        The requested revision must still be latest; reload revision metadata
        after 409. The served copy appends a nonvisual activity bridge without
        changing stored source. Activity messages are best-effort telemetry,
        not authenticated proof of a human visit. The viewer reveals HTML on
        iframe load independently of the bridge; author CSP may prevent metrics
        without hiding the document. For an allowlisted Origin and
        `Accept: text/html`, errors return generic sandboxed HTML posting
        `pagent:error`, preserving the HTTP status and no-store policy. JSON
        clients and rejected-Origin responses keep their existing error bodies.
      parameters:
        - { $ref: '#/components/parameters/RendererOrigin' }
        - { $ref: '#/components/parameters/DocumentAccept' }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [session_token, revision_id]
              properties:
                session_token: { type: string, minLength: 20, maxLength: 200 }
                revision_id: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/HtmlDocument' }
        '400':
          { $ref: '#/components/responses/DocumentFrameError', description: Invalid form fields. }
        '403':
          description: Missing or non-allowlisted Origin header; remains JSON regardless of Accept.
          content: { application/json: { schema: { $ref: '#/components/schemas/DocumentError' } } }
        '404':
          {
            $ref: '#/components/responses/DocumentFrameError',
            description: Viewer session unavailable.,
          }
        '409':
          {
            $ref: '#/components/responses/DocumentFrameError',
            description: Requested revision is no longer latest; revision_changed in JSON.,
          }
        '410':
          {
            $ref: '#/components/responses/DocumentFrameError',
            description: 'Session or link expired/revoked, or deck deleted.',
          }
        '415':
          {
            $ref: '#/components/responses/DocumentFrameError',
            description: Legacy slide revision; unsupported_format in JSON.,
          }
        '429':
          {
            $ref: '#/components/responses/DocumentFrameError',
            description: Document delivery rate limit exceeded.,
          }

  /v1/owner/document:
    post:
      operationId: getOwnerDocument
      tags: [Decks]
      summary: Deliver protected HTML for an authorized preview without a visit
      description: |
        Requires the existing auth cookie or a Bearer token with `page:read`,
        plus permission to view deck content. No separate frame token is
        issued. The exact Origin header must match an allowlisted renderer
        origin; body `allowed_origin` is not accepted. The requested revision
        must still be latest, and expired/revoked auth or deleted content fails
        closed. Credentials never appear in URLs or the served document.
        Immutable snapshots are retained, but historical preview/restore is P1.
        An allowlisted request accepting `text/html` receives a generic
        sandboxed HTML error that posts `pagent:error` to the parent, retaining
        the HTTP status and no-store policy. JSON clients and rejected Origins
        keep their existing error bodies.
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/RendererOrigin' }
        - { $ref: '#/components/parameters/DocumentAccept' }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [deck_id, revision_id]
              properties:
                deck_id: { type: string, format: uuid }
                revision_id: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/HtmlDocument' }
        '400':
          { $ref: '#/components/responses/DocumentFrameError', description: Invalid form fields. }
        '401':
          {
            $ref: '#/components/responses/DocumentFrameError',
            description: 'Authentication missing, expired, or invalid.',
          }
        '403':
          {
            $ref: '#/components/responses/DocumentFrameError',
            description: 'Origin, scope, or content denied; includes deleted content. Rejected Origins remain JSON regardless of Accept.',
          }
        '409':
          {
            $ref: '#/components/responses/DocumentFrameError',
            description: Requested revision is no longer latest; revision_changed in JSON.,
          }
        '415':
          {
            $ref: '#/components/responses/DocumentFrameError',
            description: Legacy slide revision; unsupported_format in JSON.,
          }
        '429':
          {
            $ref: '#/components/responses/DocumentFrameError',
            description: Document delivery rate limit exceeded.,
          }

  /v1/viewer/visits:
    post:
      operationId: startViewerVisit
      tags: [Engagement]
      summary: Start a human visit only after visibility and interaction qualification
      description: |
        Send `revisionId` to bind a visit to the revision actually displayed,
        including when a new revision is published while the frame is open.
        Omission retains the legacy behavior of using the latest revision.
      parameters: [{ $ref: '#/components/parameters/ViewerSession' }]
      requestBody:
