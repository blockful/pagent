openapi: 3.1.0
info:
  title: Pagent API
  version: 0.1.0
  description: |
    Hosted UI rendering for terminal-bound AI agents. The agent emits an
    A2UI surface to this service, prints a short URL, and reads the user's
    interactions back via this API.

    Spec contents are opaque to the service. The `format` field on `POST /new`
    selects how the spec is interpreted:
    - `a2ui` (default) — `spec` is an A2UI v0.9 message array. Pages take user
      input and produce a result.
    - `html` — `spec` is a UTF-8 HTML string (up to 1,000,000 bytes).
      Pages are view-only: they never transition past `open`, and
      `POST /{id}/result` returns 400 `invalid_for_format`.

    See https://github.com/blockful/pagent for the source.

    ## Page lifecycle

    A page walks a 3-state machine: `open → submitted → received`.

    - **open** — created, waiting for a browser submission.
    - **submitted** — the browser has called `POST /{id}/result`. The agent
      has not yet read the result.
    - **received** — the agent called `GET /{id}/result` at least once after
      submission. The state flip is idempotent; subsequent reads keep returning
      `received`.
  contact:
    name: Pagent maintainers
    url: https://github.com/blockful/pagent
  license:
    name: MIT
    url: https://github.com/blockful/pagent/blob/main/LICENSE

servers:
  - url: https://api.pagent.link
    description: Production
  - url: http://localhost:8787
    description: Local development

paths:
  /health:
    get:
      operationId: getHealth
      tags: [Operations]
      summary: Liveness probe with DB connectivity check
      description: |
        Returns 200 when the service and its Postgres connection are healthy.
        Returns 503 when Postgres is unreachable. Railway polls this endpoint
        and restarts the container on 503.

        This endpoint is **not** part of the versioned API contract — it is
        an ops endpoint and may change without notice.
      responses:
        '200':
          description: Service and database are healthy.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOk'
              example:
                ok: true
                db: ok
        '503':
          description: |
            Postgres is unreachable. Check the database connection string and
            the Postgres service status before retrying.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthError'
              example:
                ok: false
                db: error
                message: Database connection failed

  /openapi.json:
    get:
      operationId: getOpenapiJson
      tags: [Operations]
      summary: OpenAPI 3.1 spec (JSON — canonical machine-readable form)
      description: |
        Returns the canonical OpenAPI 3.1 document as `application/json`.
        Parsed once at boot from `docs/openapi.yaml` and cached in memory.
        This is the URL that tooling (Postman, Insomnia, OpenAPI Generator,
        Stoplight) expects to fetch. Returns 503 if the source file was
        missing at boot.
      responses:
        '200':
          description: The OpenAPI document as JSON.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
        '503':
          description: |
            `docs/openapi.yaml` was not found at boot. Ensure the file is
            present in the repository and deployed alongside the API.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [openapi_unavailable]

  /openapi.yaml:
    get:
      operationId: getOpenapiYaml
      tags: [Operations]
      summary: OpenAPI 3.1 spec (YAML — human-readable courtesy copy)
      description: |
        Returns the same OpenAPI 3.1 document as `application/yaml`.
        Served raw from memory (no re-serialisation). Useful for humans
        who prefer YAML. Tooling should prefer `/openapi.json`.
        Returns 503 if the source file was missing at boot.
      responses:
        '200':
          description: The OpenAPI document as YAML.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/yaml:
              schema:
                type: string
        '503':
          description: |
            `docs/openapi.yaml` was not found at boot. Ensure the file is
            present in the repository and deployed alongside the API.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [openapi_unavailable]

  /docs:
    get:
      operationId: getApiDocs
      tags: [Operations]
      summary: Interactive Scalar API Reference
      description: |
        Returns an HTML page rendering the Pagent API Reference via Scalar.
        Scalar fetches `/openapi.json` client-side and renders an interactive
        explorer — no build step required. Opens directly in a browser.
      responses:
        '200':
          description: The Scalar API Reference HTML page.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            text/html:
              schema:
                type: string

  /new:
    post:
      operationId: createPage
      tags: [Pages]
      summary: Create a new page
      description: |
        Creates a new page from a spec and returns a short URL to share
        with the user. The page starts in state `open`.

        The `format` field (default `a2ui`) selects the spec shape:
        - `a2ui` — `spec` is an A2UI v0.9 message array. The service stores
          and serves it back verbatim. Pages collect user input and produce a
          result.
        - `html` — `spec` is a UTF-8 HTML string (up to 1,000,000 bytes). The
          service sanitises it with DOMPurify before storage. Pages are
          view-only: they never transition past `open`, and
          `POST /{id}/result` returns 400 `invalid_for_format`.

        **What to do next:** print the returned `url` in the terminal (or chat)
        so the user can open it in a browser. For A2UI pages, poll
        `GET /{id}/result` until `state` is no longer `open`. For HTML pages,
        there is nothing to poll for — once the user opens the URL, you are
        done.

        Rate-limited to 30 requests per minute per source IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPageRequest'
            example:
              spec:
                - createSurface:
                    surfaceId: main
                    catalogId: https://a2ui.org/specification/v0_9/basic_catalog.json
                - updateComponents:
                    surfaceId: main
                    components: []
      responses:
        '201':
          description: Page created. Open the returned URL in a browser.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewPageResponse'
        '400':
          description: |
            Request body is malformed or missing the `spec` field.
            Fix the request before retrying.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '413':
          description: |
            Request body exceeds the service limit. A2UI specs cap at
            256 000 bytes (post-parse); HTML payloads cap at 1 000 000 bytes
            (wire body limit). The response's `format` field tells you which
            cap fired so you can size the next submission appropriately.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error413'
              example:
                error: payload_too_large
                format: a2ui
                max_bytes: 256000
                message: A2UI spec exceeds the 256 KB limit; use format "html" for larger payloads only when appropriate
        '429':
          description: |
            Per-IP rate limit exceeded. Wait `retry_after_seconds` seconds
            before retrying. The `Retry-After` response header carries the
            same value in seconds (RFC 7231).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429'
              example:
                error: rate_limited
                retry_after_seconds: 60
        '500':
          description: |
            Unexpected server error. Quote the `request_id` from the response
            body (or the `X-Request-ID` header — they are identical) in any
            bug report. Do not retry in a tight loop; this is unlikely to
            self-heal without a deployment.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'

  /v1/decks:
    get:
      operationId: listDecks
      tags: [Decks]
      summary: List searchable decks visible to the authenticated member
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - {
            name: scope,
            in: query,
            schema: { type: string, enum: [mine, shared, team], default: mine },
          }
        - {
            name: status,
            in: query,
            schema: { type: string, enum: [active, archived, expired, revoked] },
          }
        - { name: owner, in: query, schema: { type: string, format: uuid } }
        - { name: sender, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Deck summaries including owner, sender, link, and analytics rollups. }
        '401': { description: Authentication required. }
    post:
      operationId: publishDeck
      tags: [Decks]
      summary: Publish a durable deck or immutable revision
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishDeckRequest' }
      responses:
        '200': { description: Existing deck updated with a new revision. }
        '201': { description: Deck and first revision created. }
        '400': { description: Invalid or fully sanitized content. }
        '401': { description: Authentication required. }

  /v1/decks/{deckId}:
    parameters: [{ $ref: '#/components/parameters/DeckId' }]
    get:
      operationId: getDeck
      tags: [Decks]
      summary: Get deck metadata, revision history, and recent activity
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      responses:
        '200': { description: Deck detail. }
        '403': { description: Content access denied. }
    patch:
      operationId: renameDeck
      tags: [Decks]
      summary: Rename a deck
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [title],
                    properties: { title: { type: string, maxLength: 160 } },
                  },
              },
          }
      responses:
        '204': { description: Deck renamed. }
        '403': { description: Owner access required. }
    delete:
      operationId: deleteDeck
      tags: [Decks]
      summary: Delete a deck and immediately revoke links and sessions
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      responses:
        '204': { description: Deck deleted and viewer access revoked. }
        '403': { description: Owner access required. }

  /v1/decks/{deckId}/preview:
    parameters: [{ $ref: '#/components/parameters/DeckId' }]
    get:
      operationId: previewDeck
      tags: [Decks]
      summary: Get the latest sanitized revision without recording analytics
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      responses:
        '200': { description: Latest revision and ordered slides. }
        '403': { description: Content access denied. }

  /v1/decks/{deckId}/archive:
    parameters: [{ $ref: '#/components/parameters/DeckId' }]
    post:
      operationId: archiveDeck
      tags: [Decks]
      summary: Archive a deck
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      responses:
        { '204': { description: Deck archived. }, '403': { description: Owner access required. } }

  /v1/decks/{deckId}/restore:
    parameters: [{ $ref: '#/components/parameters/DeckId' }]
    post:
      operationId: restoreDeck
      tags: [Decks]
      summary: Restore an archived deck
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      responses:
        { '204': { description: Deck restored. }, '403': { description: Owner access required. } }

  /v1/decks/{deckId}/analytics:
    parameters: [{ $ref: '#/components/parameters/DeckId' }]
    get:
      operationId: getDeckAnalytics
      tags: [Analytics]
      summary: Get authorized deck engagement analytics
      description: Viewer email filters are deliberately unavailable in URL query parameters; use the JSON query endpoint so raw emails do not enter analytics URLs or access logs.
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      parameters:
        - { name: link_id, in: query, schema: { type: string, format: uuid } }
        - { name: sender, in: query, schema: { type: string, format: uuid } }
        - { name: revision, in: query, schema: { type: integer, minimum: 1 } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        {
          '200': { description: Overview, visitor, slide, and visit-detail analytics. },
          '403': { description: Analytics access denied. },
        }

  /v1/decks/{deckId}/analytics/query:
    parameters: [{ $ref: '#/components/parameters/DeckId' }]
    post:
      operationId: queryDeckAnalytics
      tags: [Analytics]
      summary: Filter analytics, including by viewer, without exposing filters in URLs
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AnalyticsFilters' } } }
      responses:
        {
          '200': { description: Filtered analytics. },
          '403': { description: Analytics access denied. },
        }

  /v1/decks/{deckId}/analytics.csv:
    parameters: [{ $ref: '#/components/parameters/DeckId' }]
    get:
      operationId: exportDeckAnalytics
      tags: [Analytics]
      summary: Export analytics without a viewer filter
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      responses:
        {
          '200': { description: Audited CSV export. },
          '403': { description: Analytics access denied. },
        }
    post:
      operationId: exportFilteredDeckAnalytics
      tags: [Analytics]
      summary: Export filtered analytics without exposing viewer emails in URLs
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AnalyticsFilters' } } }
      responses:
        {
          '200': { description: Audited CSV export. },
          '403': { description: Analytics access denied. },
        }

  /v1/decks/{deckId}/share-links:
    parameters: [{ $ref: '#/components/parameters/DeckId' }]
    get:
      operationId: listShareLinks
      tags: [Sharing]
      summary: List links the owner or link creator may manage
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      responses:
        {
          '200': { description: Share link summaries; raw tokens are never returned. },
          '403': { description: Access denied. },
        }
    post:
      operationId: createShareLink
      tags: [Sharing]
      summary: Create an Anyone, Allowed email, or Authenticated viewer link
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ShareLinkRequest' } } }
      responses:
        {
          '201': { description: Link created; the raw token is returned exactly once. },
          '403': { description: Owner access required. },
        }

  /v1/decks/{deckId}/share-links/{linkId}:
    parameters:
      [{ $ref: '#/components/parameters/DeckId' }, { $ref: '#/components/parameters/ShareLinkId' }]
    put:
      operationId: updateShareLink
      tags: [Sharing]
      summary: Update link access and revoke its existing viewer sessions
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ShareLinkRequest' } } }
      responses: { '204': { description: Link updated. }, '403': { description: Access denied. } }

  /v1/decks/{deckId}/share-links/{linkId}/revoke:
    parameters:
      [{ $ref: '#/components/parameters/DeckId' }, { $ref: '#/components/parameters/ShareLinkId' }]
    post:
      operationId: revokeShareLink
      tags: [Sharing]
      summary: Revoke a link and all already-open sessions
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      responses:
        {
          '204': { description: Link and sessions revoked. },
          '403': { description: Access denied. },
        }

  /v1/decks/{deckId}/share-links/{linkId}/preview:
    parameters:
      [{ $ref: '#/components/parameters/DeckId' }, { $ref: '#/components/parameters/ShareLinkId' }]
    post:
      operationId: previewShareLink
      tags: [Sharing]
      summary: Create an analytics-excluded owner preview session
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      responses:
        {
          '200': { description: Short-lived preview session. },
          '403': { description: Access denied. },
        }

  /v1/decks/{deckId}/share-links/{linkId}/requests:
    parameters:
      [{ $ref: '#/components/parameters/DeckId' }, { $ref: '#/components/parameters/ShareLinkId' }]
    get:
      operationId: listAccessRequests
      tags: [Sharing]
      summary: List link-specific access requests
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      responses:
        { '200': { description: Access requests. }, '403': { description: Access denied. } }

  /v1/decks/{deckId}/share-links/{linkId}/requests/{requestId}:
    parameters:
      - { $ref: '#/components/parameters/DeckId' }
      - { $ref: '#/components/parameters/ShareLinkId' }
      - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: decideAccessRequest
      tags: [Sharing]
      summary: Approve or deny a request without changing the link access mode
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [decision],
                    properties: { decision: { type: string, enum: [approved, denied] } },
                  },
              },
          }
      responses:
        { '204': { description: Decision recorded. }, '403': { description: Access denied. } }

  /v1/decks/{deckId}/access:
    parameters: [{ $ref: '#/components/parameters/DeckId' }]
    get:
      operationId: getDeckAccessSettings
      tags: [Permissions]
      summary: Get content collaborators, workspace members, teams, analytics scope, consent, and retention
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      responses:
        { '200': { description: Access settings. }, '403': { description: Owner access required. } }

  /v1/decks/{deckId}/access/members:
    parameters: [{ $ref: '#/components/parameters/DeckId' }]
    post:
      operationId: addWorkspaceMember
      tags: [Permissions]
      summary: Add or reactivate a member by email
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [email, role],
                    properties:
                      {
                        email: { type: string, format: email },
                        role: { type: string, enum: [admin, member] },
                      },
                  },
              },
          }
      responses:
        { '201': { description: Member added. }, '403': { description: Owner access required. } }

  /v1/decks/{deckId}/access/members/{memberId}:
    parameters:
      - { $ref: '#/components/parameters/DeckId' }
      - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: removeWorkspaceMember
      tags: [Permissions]
      summary: Suspend a member and immediately remove content and analytics access
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      responses:
        {
          '204': { description: Member access removed. },
          '403': { description: Owner access required. },
        }

  /v1/decks/{deckId}/access/collaborators:
    parameters: [{ $ref: '#/components/parameters/DeckId' }]
    put:
      operationId: setDeckCollaborators
      tags: [Permissions]
      summary: Set the active members who may view deck content
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [memberIds],
                    properties:
                      { memberIds: { type: array, items: { type: string, format: uuid } } },
                  },
              },
          }
      responses:
        {
          '204': { description: Content collaborators replaced. },
          '403': { description: Owner access required. },
        }

  /v1/decks/{deckId}/access/analytics/preview:
    parameters: [{ $ref: '#/components/parameters/DeckId' }]
    post:
      operationId: previewAnalyticsAudience
      tags: [Permissions]
      summary: Preview the exact active members a visibility change would authorize
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/AnalyticsVisibilityRequest' } },
          }
      responses:
        {
          '200': { description: Exact effective audience. },
          '403': { description: Owner access required. },
        }

  /v1/decks/{deckId}/access/analytics:
    parameters: [{ $ref: '#/components/parameters/DeckId' }]
    put:
      operationId: setAnalyticsVisibility
      tags: [Permissions]
      summary: Set private, selected, team, or workspace analytics visibility
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/AnalyticsVisibilityRequest' } },
          }
      responses:
        {
          '200': { description: Saved scope and exact effective audience. },
          '403': { description: Owner access required. },
        }

  /v1/decks/{deckId}/access/policy:
    parameters: [{ $ref: '#/components/parameters/DeckId' }]
    put:
      operationId: setAnalyticsPolicy
      tags: [Permissions]
      summary: Configure viewer consent and analytics retention
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [consentRequired, retentionDays],
                    properties:
                      {
                        consentRequired: { type: boolean },
                        retentionDays: { type: integer, minimum: 30, maximum: 2555 },
                      },
                  },
              },
          }
      responses:
        {
          '204': { description: Policy saved and audited. },
          '403': { description: Owner access required. },
        }

  /v1/decks/{deckId}/access/viewer:
    parameters: [{ $ref: '#/components/parameters/DeckId' }]
    delete:
      operationId: deleteViewerAnalytics
      tags: [Permissions]
      summary: Delete retained analytics for a normalized viewer email
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [email],
                    properties: { email: { type: string, format: email } },
                  },
              },
          }
      responses:
        {
          '200':
            { description: Number of visits removed; the audit event stores only an email hash. },
          '403': { description: Owner access required. },
        }

  /v1/decks/{deckId}/audit:
    parameters: [{ $ref: '#/components/parameters/DeckId' }]
    get:
      operationId: getDeckAuditLog
      tags: [Permissions]
      summary: Get permission, sharing, access, deletion, and export audit events
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      responses:
        {
          '200': { description: Most recent 200 deck audit events. },
          '403': { description: Owner access required. },
        }

  /v1/share:
    get:
      operationId: getShareMetadata
      tags: [Viewer]
      summary: Resolve non-sensitive metadata and availability for a share token
      parameters: [{ $ref: '#/components/parameters/ShareToken' }]
      responses:
        {
          '200': { description: Deck title, sender, access mode, and state; never deck content. },
          '404': { description: Generic unavailable response. },
        }

  /v1/share/access:
    post:
      operationId: requestViewerSession
      tags: [Viewer]
      summary: Open a viewer session under the link access mode
      parameters: [{ $ref: '#/components/parameters/ShareToken' }]
      requestBody:
        content:
          {
            application/json:
              { schema: { type: object, properties: { email: { type: string, format: email } } } },
          }
      responses:
        {
          '200': { description: Granted session or generic access gate state. },
          '404': { description: Generic unavailable response. },
        }

  /v1/share/request:
    post:
      operationId: createAccessRequest
      tags: [Viewer]
      summary: Ask the sender for link-specific access
      parameters: [{ $ref: '#/components/parameters/ShareToken' }]
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [email],
                    properties: { email: { type: string, format: email } },
                  },
              },
          }
      responses:
        {
          '202': { description: Generic request accepted response. },
          '404': { description: Generic unavailable response. },
        }

  /v1/share/request/{requestId}:
    parameters:
      - { $ref: '#/components/parameters/ShareToken' }
      - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getAccessRequestStatus
      tags: [Viewer]
      summary: Check a link-specific request state
      responses:
        {
          '200': { description: Pending, approved, or denied. },
          '404': { description: Generic unavailable response. },
        }

  /v1/viewer/deck:
    get:
      operationId: getViewerDeck
      tags: [Viewer]
      summary: Fetch sanitized deck content for a live viewer session
      parameters: [{ $ref: '#/components/parameters/ViewerSession' }]
      responses:
        {
          '200': { description: Ordered slides and identity confidence. },
          '410': { description: Session expired, revoked, or deck deleted. },
        }

  /v1/viewer/visits:
    post:
      operationId: startViewerVisit
      tags: [Engagement]
      summary: Start a human visit only after visibility and interaction qualification
      parameters: [{ $ref: '#/components/parameters/ViewerSession' }]
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '#/components/schemas/StartVisitRequest' } } }
      responses:
        {
          '201':
            {
              description: Visit started,
              excluded as preview or automation,
              or disabled by consent.,
            },
        }

  /v1/viewer/visits/{visitId}/events:
    parameters:
      - { $ref: '#/components/parameters/ViewerSession' }
      - { name: visitId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: ingestEngagementEvents
      tags: [Engagement]
      summary: Idempotently ingest ordered or out-of-order engagement events
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EngagementBatch' } } }
      responses:
        {
          '204': { description: Events accepted idempotently. },
          '403': { description: Session does not own the visit. },
        }

  /{id}:
    parameters:
      - $ref: '#/components/parameters/PageId'
    get:
      operationId: getPage
      tags: [Pages]
      summary: Get page spec and current state
      description: |
        Returns the full page record including the original `spec`, the
        current `state`, the `result` (null until submitted), and when the
        page expires.

        **What to do next:**
        - If `state` is `open`, the user has not yet submitted. Show them the
          URL or wait.
        - If `state` is `submitted`, the result is ready — read it via
          `GET /{id}/result`.
        - If `state` is `received`, you have already consumed the result.
        - If `expires_at` is in the past, the page has been deleted and you
          will get 404.
      responses:
        '200':
          description: Page found.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponse'
        '404':
          description: |
            No active page with this ID exists. It may have expired (default
            TTL 30 minutes) or never been created. Create a new page if you
            need another.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '500':
          description: Unexpected server error. See 500 on `POST /new` for guidance.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'

  /{id}/result:
    parameters:
      - $ref: '#/components/parameters/PageId'
    post:
      operationId: submitResult
      tags: [Pages]
      summary: Submit a user action for a page (browser → service)
      description: |
        Called by the renderer (browser) when the user submits a form. The
        body is an A2UI action object that the agent reads back via
        `GET /{id}/result`.

        Requires the page to be in state `open`. Calling this twice on the
        same page returns 409.

        **Note:** this endpoint is typically called by the Pagent renderer,
        not directly by the agent. Agents should use `GET /{id}/result`
        to read back the submitted action.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResultRequest'
            example:
              name: submitted
              surfaceId: main
              sourceComponentId: submit-btn
              context:
                color: blue
              timestamp: '2024-01-15T12:34:56.789Z'
      responses:
        '200':
          description: Result recorded. The page is now in state `submitted`.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitOk'
        '400':
          description: |
            Request body is malformed or missing required fields (`name`,
            `surfaceId`); error `bad_request`. Or the target page is HTML
            (view-only and cannot accept a result); error `invalid_for_format`.
            Fix the request — or, for `invalid_for_format`, stop trying to
            submit to this page — before retrying.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '404':
          description: |
            No active page with this ID. The page may have expired. Create
            a new page.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '409':
          description: |
            The page was already submitted. Each page is single-shot — only
            one result can be recorded per page. Create a new page if you
            need another submission.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '500':
          description: Unexpected server error. See 500 on `POST /new` for guidance.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
    get:
      operationId: getResult
      tags: [Pages]
      summary: Poll for a submitted result (agent → service)
      description: |
        Returns the current `state` and `result` for the page. Agents use
        this to poll until the user has submitted the form.

        **State transitions on read:**
        - If `state` is `open`, the user has not yet submitted. Poll again
          after a short back-off (e.g. 1 s, doubling to 30 s max).
        - The **first** call after submission returns `state: "submitted"` and
          the full result, then atomically flips the page to `received`. Use
          the returned result immediately — this is your one chance to observe
          the `submitted` state.
        - Subsequent calls return `state: "received"` with the same result.

        **What to do next:** parse the `result` object and continue the agent
        conversation. `result` is null until the user submits.
      responses:
        '200':
          description: State and result returned.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'
        '404':
          description: |
            No active page with this ID. The page may have expired. Create
            a new page.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '500':
          description: Unexpected server error. See 500 on `POST /new` for guidance.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'

components:
  parameters:
    PageId:
      name: id
      in: path
      required: true
      description: 32-character lowercase hex page identifier.
      schema:
        $ref: '#/components/schemas/PageId'
    DeckId:
      name: deckId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ShareLinkId:
      name: linkId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ShareToken:
      name: X-Share-Token
      in: header
      required: true
      description: Opaque token returned only when the share link is created.
      schema: { type: string, minLength: 20 }
    ViewerSession:
      name: X-Viewer-Session
      in: header
      required: true
      description: Opaque viewer or owner-preview session token with a maximum seven-day lifetime.
      schema: { type: string, minLength: 20 }

  headers:
    XRequestId:
      description: >
        A unique identifier for this request (32-character lowercase hex or a
        client-supplied value up to 128 characters). Quote it in bug reports —
        the same ID appears on every log line for that request.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,128}$'
    RetryAfter:
      description: Seconds to wait before the next attempt (RFC 7231).
      schema:
        type: integer
        minimum: 1

  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: pagent_session
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    PublishDeckRequest:
      type: object
      additionalProperties: false
      required: [title, slides]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 2000 }
        client_label: { type: string, maxLength: 160 }
        update_deck_id: { type: string, format: uuid }
        slides:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [id, html]
            properties:
              id: { type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9._-]*$' }
              title: { type: string, maxLength: 200 }
              html: { type: string, minLength: 1, maxLength: 1000000 }

    ShareLinkRequest:
      type: object
      additionalProperties: false
      required: [name, access_mode]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        access_mode: { type: string, enum: [anyone, allowed_email, authenticated] }
        allowed_emails: { type: array, maxItems: 500, items: { type: string, format: email } }
        allowed_domains: { type: array, maxItems: 100, items: { type: string, maxLength: 255 } }
        expires_at: { type: string, format: date-time }

    AnalyticsFilters:
      type: object
      additionalProperties: false
      properties:
        link_id: { type: string, format: uuid }
        viewer:
          {
            type: string,
            maxLength: 320,
            description: Sent in JSON so raw emails never enter analytics URLs.,
          }
        sender: { type: string, format: uuid }
        revision: { type: integer, minimum: 1 }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }

    AnalyticsVisibilityRequest:
      type: object
      additionalProperties: false
      required: [scope, subjectIds]
      properties:
        scope: { type: string, enum: [private, selected, team, workspace] }
        subjectIds: { type: array, items: { type: string, format: uuid } }

    StartVisitRequest:
      type: object
      additionalProperties: false
      required: [visible, interacted, analyticsConsent, deviceClass, browserFamily, countryCode]
      properties:
        visible:
          { type: boolean, description: True only when the viewer is at least 50 percent visible. }
        interacted: { type: boolean }
        analyticsConsent: { type: boolean }
        deviceClass: { type: string, enum: [mobile, tablet, desktop, unknown] }
        browserFamily: { type: string, maxLength: 80 }
        countryCode: { type: [string, 'null'], minLength: 2, maxLength: 2 }

    EngagementBatch:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required:
              [
                id,
                eventType,
                eventAt,
                sequence,
                visibleRatio,
                visibleDurationMs,
                tabVisible,
                recentlyActive,
              ]
            properties:
              id: { type: string, format: uuid, description: Idempotency key. }
              eventType: { type: string, enum: [start, heartbeat, slide_view, close] }
              slideId: { type: string, format: uuid }
              eventAt: { type: string, format: date-time }
              sequence: { type: integer, minimum: 0 }
              visibleRatio: { type: number, minimum: 0, maximum: 1 }
              visibleDurationMs: { type: integer, minimum: 0, maximum: 60000 }
              tabVisible: { type: boolean }
              recentlyActive:
                {
                  type: boolean,
                  description: False after 60 seconds without mouse,
                  touch,
                  or keyboard activity.,
                }

    PageId:
      type: string
      pattern: '^[a-f0-9]{32}$'
      description: 32-character lowercase hex identifier generated at page creation.
      example: c0f2ec161aac8b1a8d26222f45ca812d

    PageState:
      type: string
      enum: [open, submitted, received]
      description: |
        Lifecycle state of a page:
        - `open` — awaiting user submission.
        - `submitted` — user submitted; agent has not yet read the result.
        - `received` — agent has consumed the result via `GET /{id}/result`.

    Spec:
      description: >
        Page contents. Shape depends on the request's `format` field:
        `a2ui` (default) — an array of A2UI v0.9 messages; the service stores
        and returns this verbatim without parsing the structure.
        `html` — a UTF-8 HTML string up to 1,000,000 bytes; the service runs
        DOMPurify on the string at create time and stores the sanitised
        result.
      oneOf:
        - type: array
          description: A2UI v0.9 message array (when format is `a2ui`).
          items:
            type: object
            additionalProperties: true
        - type: string
          description: HTML body, up to 1,000,000 bytes (when format is `html`).
      example:
        - createSurface:
            surfaceId: main
            catalogId: https://a2ui.org/specification/v0_9/basic_catalog.json
        - updateComponents:
            surfaceId: main
            components: []

    PageFormat:
      type: string
      enum: [a2ui, html]
      description: |
        Spec format. `a2ui` (default) — `spec` is an A2UI v0.9 message array.
        `html` — `spec` is a UTF-8 HTML string up to 1,000,000 bytes; the
        page becomes view-only and never produces a result.

    NewPageRequest:
      type: object
      required: [spec]
      properties:
        spec:
          $ref: '#/components/schemas/Spec'
        format:
          type: string
          enum: [a2ui, html]
          default: a2ui
          description: |
            Spec format. `a2ui` (default) — `spec` is an A2UI v0.9 message array.
            `html` — `spec` is a UTF-8 HTML string up to 1,000,000 bytes; the
            page becomes view-only and never produces a result.

    NewPageResponse:
      type: object
      required: [id, url, expires_at]
      properties:
        id:
          $ref: '#/components/schemas/PageId'
        url:
          type: string
          format: uri
          description: >
            Short URL for the user to open in a browser. Points to the
            Pagent renderer with this page's ID.
          example: https://pagent.link/c0f2ec161aac8b1a8d26222f45ca812d
        expires_at:
          type: integer
          description: Unix epoch milliseconds when this page will be deleted.
          example: 1709122000000

    PageResponse:
      type: object
      required: [spec, state, result, expires_at]
      properties:
        spec:
          $ref: '#/components/schemas/Spec'
        format:
          $ref: '#/components/schemas/PageFormat'
        state:
          $ref: '#/components/schemas/PageState'
        result:
          type: object
          nullable: true
          description: >
            The submitted A2UI action, or null if the page is still open or
            if the page is an HTML page (HTML pages never produce a result).
            Shape mirrors `ResultRequest`.
        expires_at:
          type: integer
          description: Unix epoch milliseconds when this page will be deleted.
          example: 1709122000000

    ResultRequest:
      type: object
      required: [name, surfaceId]
      additionalProperties: true
      description: >
        An A2UI action object. Extra fields beyond those listed here are
        preserved verbatim (`.passthrough()` behaviour).
      properties:
        name:
          type: string
          minLength: 1
          description: Event name emitted by the A2UI component.
          example: submitted
        surfaceId:
          type: string
          minLength: 1
          description: ID of the surface that emitted the action.
          example: main
        sourceComponentId:
          type: string
          description: ID of the component that triggered the action.
          example: submit-btn
        context:
          type: object
          additionalProperties: true
          description: Arbitrary key/value pairs captured from the form state.
          example:
            color: blue
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp of when the action was triggered.
          example: '2024-01-15T12:34:56.789Z'

    ResultResponse:
      type: object
      required: [state, result]
      properties:
        state:
          $ref: '#/components/schemas/PageState'
        format:
          $ref: '#/components/schemas/PageFormat'
        result:
          type: object
          nullable: true
          description: >
            The submitted A2UI action, or null if the page is still `open`.
            HTML pages always return null here — they never produce a result.

    SubmitOk:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]

    HealthOk:
      type: object
      required: [ok, db]
      properties:
        ok:
          type: boolean
          enum: [true]
        db:
          type: string
          enum: [ok]

    HealthError:
      type: object
      required: [ok, db, message]
      properties:
        ok:
          type: boolean
          enum: [false]
        db:
          type: string
          enum: [error]
        message:
          type: string
          description: Human-readable description of the failure.
          example: Database connection failed

    Error400:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum: [bad_request, invalid_for_format, sanitized_empty]
          description: |
            `bad_request` — body is malformed or fails schema validation.
            `invalid_for_format` — operation is not supported for this page's
            format (e.g. POSTing a result to an HTML page).
            `sanitized_empty` — `POST /new` with `format: "html"` whose payload
            was reduced to empty by the sanitizer (only forbidden tags like
            `<script>` or `<iframe>` were supplied). Re-author the HTML with
            safe markup and inline styles.
        format:
          type: string
          enum: [a2ui, html]
          description: |
            Present on `invalid_for_format` and `sanitized_empty` errors —
            identifies which format triggered the rejection.
        message:
          type: string
          description: Human-readable description of why the request was rejected.
          example: Request body did not match the expected schema
        issues:
          type: array
          description: Zod validation issues describing what failed.
          items:
            type: object
            additionalProperties: true

    Error404:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum: [not_found]
        message:
          type: string
          description: Human-readable description of what was not found.
          example: Page not found or expired

    Error409:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum: [conflict]
        message:
          type: string
          description: Human-readable description of the conflict.
          example: Page was already submitted; create a new page if you need another submission

    Error413:
      type: object
      required: [error, max_bytes, message]
      properties:
        error:
          type: string
          enum: [payload_too_large]
        format:
          type: string
          enum: [a2ui, html]
          description: |
            The format whose size cap was exceeded. `a2ui` caps at 256 000 bytes
            (enforced post-parse). `html` caps at 1 000 000 bytes (enforced by
            the body-limit middleware before parse).
        max_bytes:
          type: integer
          description: Maximum allowed body size in bytes for this format.
          example: 256000
        message:
          type: string
          description: Human-readable description of the size limit.
          example: A2UI spec exceeds the 256 KB limit; use format "html" for larger payloads only when appropriate

    Error429:
      type: object
      required: [error, retry_after_seconds, message]
      properties:
        error:
          type: string
          enum: [rate_limited]
        retry_after_seconds:
          type: integer
          description: Seconds to wait before retrying.
          example: 60
        message:
          type: string
          description: Human-readable rate limit message including the retry delay.
          example: Too many requests; retry after 60 seconds

    Error500:
      type: object
      required: [error, request_id, message]
      properties:
        error:
          type: string
          enum: [internal_error]
        request_id:
          type: string
          description: >
            The `X-Request-ID` for this request. Quote it in bug reports so
            maintainers can locate the matching log lines and traces.
          example: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
        message:
          type: string
          description: Human-readable description of the error. Always safe to show to users.
          example: An unexpected error occurred; quote the request_id when reporting this
