<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Agent UI</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=account_circle,add,arrow_back,arrow_drop_down,arrow_forward,attach_file,calendar_today,call,camera,check,check_circle,close,communication,content_copy,dark_mode,delete,download,draw,edit,error,event,favorite,favorite_off,folder,help,home,info,light_mode,location_on,lock,lock_open,mail,menu,mobile_layout,more_horiz,more_vert,notifications,notifications_off,payment,pen_size_1,person,phone,photo,print,progress_activity,rectangle,refresh,search,send,settings,share,shopping_cart,star,star_half,star_off,upload,visibility,visibility_off,warning"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light dark;
        --primary: #5154b3;
        --primary-light: #a0a3ff;
        --bg: light-dark(#f6f7f8, #101922);
        --fg: light-dark(#1b1b1b, #e2e2e2);
        --muted: light-dark(#666, #999);
        --error: #ba1a1a;
        --error-bg: light-dark(#ffedea, #2b1413);
        --bb-grid-size: 4px;
        --bb-grid-size-3: calc(var(--bb-grid-size) * 3);
        --bb-grid-size-4: calc(var(--bb-grid-size) * 4);
        --bb-grid-size-6: calc(var(--bb-grid-size) * 6);
        --font-family: 'Outfit', system-ui, -apple-system, sans-serif;
        --background: radial-gradient(at 0% 0%, light-dark(rgba(161, 196, 253, 0.3), rgba(6, 182, 212, 0.15)) 0px, transparent 50%),
          radial-gradient(at 100% 100%, light-dark(rgba(162, 210, 255, 0.3), rgba(20, 184, 166, 0.15)) 0px, transparent 50%);
      }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: var(--font-family);
        background: var(--bg) var(--background) fixed;
        color: var(--fg);
        min-height: 100vh;
      }
      #app {
        max-width: 640px;
        margin: 0 auto;
        padding: var(--bb-grid-size-6) var(--bb-grid-size-3);
      }
      #app.is-home {
        max-width: none;
        margin: 0;
        padding: 0;
      }
      .status {
        font-size: 14px;
        color: var(--muted);
        text-align: center;
        padding: var(--bb-grid-size-4);
      }
      .error {
        background: var(--error-bg);
        color: var(--error);
        padding: 16px;
        border-radius: 8px;
        margin: 16px 0;
      }
      .pending { display: flex; flex-direction: column; gap: 16px; align-items: center; padding: 64px 16px; }
      .spinner {
        width: 40px; height: 40px;
        border: 4px solid rgba(127,127,127,0.2);
        border-left-color: var(--primary);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .material-symbols { font-family: 'Material Symbols Outlined', sans-serif; font-variation-settings: 'FILL' 1; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
