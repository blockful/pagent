<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Agent UI</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=account_circle,add,arrow_back,arrow_drop_down,arrow_forward,attach_file,calendar_today,call,camera,check,check_circle,close,communication,content_copy,dark_mode,delete,download,draw,edit,error,event,favorite,favorite_off,folder,help,home,info,light_mode,location_on,lock,lock_open,mail,menu,mobile_layout,more_horiz,more_vert,notifications,notifications_off,payment,pen_size_1,person,phone,photo,print,progress_activity,rectangle,refresh,search,send,settings,share,shopping_cart,star,star_half,star_off,upload,visibility,visibility_off,warning"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light dark;
        --primary: #5154b3;
        --primary-light: #a0a3ff;
        --bg: light-dark(#f6f7f8, #0a0a0a);
        --fg: light-dark(#0a0a0a, #fafafa);
        --muted: light-dark(#737373, #a3a3a3);
        --error: #ef4444;
        --error-bg: light-dark(#fef2f2, #2b1413);
        --bb-grid-size: 4px;
        --bb-grid-size-3: calc(var(--bb-grid-size) * 3);
        --bb-grid-size-4: calc(var(--bb-grid-size) * 4);
        --bb-grid-size-6: calc(var(--bb-grid-size) * 6);
        --font-family: 'Outfit', system-ui, -apple-system, sans-serif;
        --background:
          radial-gradient(
            at 0% 0%,
            light-dark(rgba(161, 196, 253, 0.3), rgba(6, 182, 212, 0.15)) 0px,
            transparent 50%
          ),
          radial-gradient(
            at 100% 100%,
            light-dark(rgba(162, 210, 255, 0.3), rgba(20, 184, 166, 0.15)) 0px,
            transparent 50%
          );

        --a2ui-color-primary: var(--primary);
        --a2ui-color-primary-hover: light-dark(#4345a0, #6668c9);
        --a2ui-color-on-primary: #fff;
        --a2ui-color-secondary: light-dark(#f4f4f5, #27272a);
        --a2ui-color-secondary-hover: light-dark(#e4e4e7, #3f3f46);
        --a2ui-color-on-secondary: light-dark(#18181b, #fafafa);
        --a2ui-color-surface: light-dark(#ffffff, #0a0a0a);
        --a2ui-color-on-surface: light-dark(#0a0a0a, #fafafa);
        --a2ui-color-border: light-dark(#e4e4e7, #27272a);
        --a2ui-color-input: light-dark(#ffffff, #0a0a0a);
        --a2ui-color-on-input: light-dark(#0a0a0a, #fafafa);
        --a2ui-color-on-background: var(--fg);
        --a2ui-color-ring: var(--primary);
        --a2ui-color-muted: light-dark(#f4f4f5, #27272a);
        --a2ui-color-muted-fg: light-dark(#71717a, #a1a1aa);
        --a2ui-border-width: 1px;
        --a2ui-border: 1px solid var(--a2ui-color-border);
        --a2ui-border-radius: 0.375rem;
        --a2ui-spacing-xs: 0.25rem;
        --a2ui-spacing-s: 0.5rem;
        --a2ui-spacing-m: 0.75rem;
        --a2ui-spacing-l: 1rem;
        --a2ui-font-size-xs: 0.75rem;
        --a2ui-font-size-s: 0.875rem;
        --a2ui-font-size-m: 1rem;
        --a2ui-font-size-l: 1.125rem;
        --a2ui-font-size-xl: 1.25rem;
        --a2ui-font-size-2xl: 1.875rem;
        --a2ui-label-font-size: 0.875rem;
        --a2ui-label-font-weight: 500;
        --a2ui-line-height-headings: 1.2;
        --a2ui-line-height-body: 1.5;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        font-family: var(--font-family);
        background: var(--bg) var(--background) fixed;
        color: var(--fg);
        min-height: 100vh;
      }
      #app {
        max-width: 640px;
        margin: 0 auto;
        padding: var(--bb-grid-size-6) var(--bb-grid-size-3);
      }
      #app.is-home {
        max-width: none;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
